<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c53030" />
  <title>MegaMerca</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <span class="brand">MegaMerca</span>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar Producto..." autocomplete="off" />
      </div>
      <button id="profile-btn" class="icon-btn" aria-label="Perfil">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>
    <div id="home-tabs" class="home-tabs">
      <button class="home-tab active" data-tab="businesses">Negocios</button>
      <button class="home-tab" data-tab="products">Productos</button>
    </div>
  </header>

  <main id="view-home" class="view">
    <div id="tab-businesses" class="tab-content">
      <div id="business-list" class="business-grid"></div>
    </div>
    <div id="tab-products" class="tab-content hidden">
      <div id="category-bar" class="category-bar"></div>
      <div id="product-list" class="product-grid"></div>
      <button id="back-to-top" class="back-to-top">Volver arriba ↑</button>
    </div>
    <div id="business-detail" class="business-detail hidden">
      <div class="business-detail-head">
        <button id="business-back" class="icon-btn">←</button>
        <div class="business-detail-info">
          <div id="business-detail-name" class="business-detail-name"></div>
          <div id="business-detail-cat" class="business-detail-cat"></div>
        </div>
      </div>
      <div id="business-category-bar" class="category-bar"></div>
      <div id="business-products" class="product-grid"></div>
      <button id="biz-back-to-top" class="back-to-top">Volver arriba ↑</button>
      <div class="recommended-section">
        <div class="section-title">Negocios recomendados</div>
        <div id="recommended-list" class="business-grid business-grid-small"></div>
      </div>
    </div>
  </main>

  <main id="view-cart" class="view hidden">
    <div class="section-title">Tu carrito</div>
    <div id="cart-items" class="cart-items"></div>
  </main>

  <nav class="bottomnav">
    <div class="bottomnav-inner">
      <button class="nav-btn active" data-view="home" aria-label="Inicio">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg>
      </button>
      <button class="nav-btn" data-view="cart" aria-label="Carrito">
        <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        <span id="cart-badge" class="cart-badge hidden">0</span>
      </button>
    </div>
  </nav>

  <div id="checkout-modal" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Datos del pedido</h2>
      <button id="checkout-close" class="icon-btn">✕</button>
    </div>
    <form id="checkout-form" class="sheet-body">
      <label>Nombre del cliente
        <input type="text" name="clientName" required autocomplete="name" />
      </label>
      <label>Teléfono / contacto
        <input type="text" name="contact" required autocomplete="tel" />
      </label>
      <label>Lugar / dirección
        <input type="text" name="place" required />
      </label>
      <label>Fecha de entrega
        <input type="date" name="date" />
      </label>
      <label>Hora de entrega
        <input type="time" name="time" />
      </label>
      <button type="submit" class="primary-btn">Confirmar pedido</button>
      <p id="checkout-status" class="status-msg"></p>
    </form>
  </div>

  <main id="view-profile" class="view hidden">
    <div class="profile-tabs">
      <button class="profile-tab active" data-tab="info">Perfil</button>
      <button class="profile-tab" data-tab="history">Historial</button>
    </div>
    <div id="tab-info" class="tab-content">
      <form id="profile-form" class="profile-form">
        <label>Nombre
          <input type="text" name="profileName" required autocomplete="name" />
        </label>
        <label>Teléfono / contacto
          <input type="text" name="profileContact" required autocomplete="tel" />
        </label>
        <label>Dirección
          <input type="text" name="profilePlace" required />
        </label>
        <button type="submit" class="primary-btn">Guardar</button>
        <p id="profile-status" class="status-msg"></p>
      </form>
    </div>
    <div id="tab-history" class="tab-content hidden">
      <div id="history-list" class="history-list"></div>
    </div>
  </main>

  <div id="overlay" class="overlay"></div>

  <script src="app.js"></script>
</body>
</html>
