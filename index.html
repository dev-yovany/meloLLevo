<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#85CF6F" />
  <title>MegaMerca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preload" as="image" href="fotos%20ejemplo/fondoHero.jpg" />
</head>
<body>
  <main id="view-home" class="view">
    <div class="brand-hero">
      <div class="hero-row">
        <div class="logo-square"><img src="fotos%20ejemplo/logo.png" alt="MegaMerca" /></div>
        <div class="nav-cluster">
          <button class="nav-btn" data-view="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
            <span class="nav-label">Carrito</span>
            <span class="cart-badge hidden">0</span>
          </button>
          <button class="nav-btn" data-view="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="nav-label">Perfil</span>
          </button>
        </div>
      </div>
      <div class="hero-mini">
        <div class="logo-square mini"><img src="fotos%20ejemplo/logo.png" alt="MegaMerca" /></div>
        <div class="nav-mini">
          <div class="search-box mini">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
            <input class="search-input" type="text" placeholder="Buscar producto..." autocomplete="off" />
          </div>
          <button class="nav-btn mini active" data-view="home" aria-label="Inicio">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg>
          </button>
          <button class="nav-btn mini" data-view="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
            <span class="cart-badge hidden">0</span>
          </button>
          <button class="nav-btn mini" data-view="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
        </div>
      </div>
    </div>
    <button id="business-hero-back" class="biz-back-btn hidden" aria-label="Volver"><span>&lt;</span></button>
    <button id="product-hero-back" class="biz-back-btn hidden" aria-label="Volver"><span>&lt;</span></button>
    <div class="business-hero hidden" id="business-hero">
      <div class="business-hero-img" id="business-hero-img"></div>
    </div>
    <div class="product-hero hidden" id="product-hero">
      <div class="product-hero-img" id="product-hero-img"></div>
    </div>
    <div class="page">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input type="text" id="search-input" class="search-input" placeholder="Buscar producto..." autocomplete="off" />
      </div>
      <div class="featured-section" id="featured-section">
      <div id="featured-viewport" class="featured-viewport">
        <div id="featured-track" class="featured-track"></div>
      </div>
      <div id="featured-dots" class="featured-dots"></div>
    </div>
    <div id="home-tabs" class="home-tabs">
      <button class="home-tab active" data-tab="businesses">Negocios</button>
      <button class="home-tab" data-tab="products">Productos</button>
      <div id="home-tab-indicator" class="home-tab-indicator"></div>
    </div>
    <div id="tab-businesses" class="tab-content">
      <div id="businesses-list-toggle" class="view-toggle" data-grid="business-list" data-default="grid">
        <div class="view-toggle-group green">
          <button class="view-toggle-btn" data-view="list" aria-label="Vista de lista">
            <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-toggle-btn active" data-view="grid" aria-label="Vista de cuadrícula">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
        </div>
      </div>
      <div id="business-list" class="business-grid"></div>
    </div>
    <div id="tab-products" class="tab-content hidden">
      <div id="category-bar" class="category-bar"></div>
      <div id="products-view-toggle" class="view-toggle" data-grid="product-list" data-default="grid">
        <div class="view-toggle-group">
          <button class="view-toggle-btn" data-view="list" aria-label="Vista de lista">
            <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-toggle-btn active" data-view="grid" aria-label="Vista de cuadrícula">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
        </div>
      </div>
      <div id="product-list" class="product-grid"></div>
      <button id="back-to-top" class="back-to-top">Volver arriba</button>
    </div>
    <div id="business-detail" class="business-detail hidden">
      <div class="business-detail-head">
        <div class="business-detail-info">
          <div class="biz-title-row">
            <div id="business-detail-name" class="business-detail-name"></div>
            <span id="business-detail-pill"></span>
          </div>
          <div id="business-detail-cat" class="business-detail-cat"></div>
          <div id="business-detail-status" class="business-detail-status"></div>
        </div>
      </div>
      <div id="business-category-bar" class="category-bar"></div>
      <div id="business-view-toggle" class="view-toggle" data-grid="business-products" data-default="list">
        <div class="view-toggle-group">
          <button class="view-toggle-btn active" data-view="list" aria-label="Vista de lista">
            <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
          <button class="view-toggle-btn" data-view="grid" aria-label="Vista de cuadrícula">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
        </div>
      </div>
      <div id="business-products" class="product-grid"></div>
      <button id="biz-back-to-top" class="back-to-top">Volver arriba</button>
      <div class="recommended-section">
        <div class="section-title">Negocios recomendados</div>
        <div id="recommended-list" class="business-grid business-grid-small"></div>
</div>
    </div>
    <div id="product-detail" class="business-detail hidden">
      <div class="business-detail-head">
        <div class="business-detail-info">
          <div class="biz-title-row">
            <div id="product-detail-name" class="business-detail-name"></div>
            <span id="product-detail-pill"></span>
          </div>
          <div id="product-detail-biz" class="business-detail-cat"></div>
          <div id="product-detail-price" class="product-detail-price"></div>
        </div>
      </div>
      <div id="product-detail-desc" class="product-detail-desc"></div>
      <div id="product-options" class="product-options hidden"></div>
      <div id="product-detail-actions" class="product-detail-actions">
        <button id="product-detail-add" class="add-capsule">
          <span>Añadir al carrito</span>
        </button>
        <div id="product-detail-qty" class="detail-qty hidden">
          <button type="button" class="cq-btn" data-a="minus" aria-label="Quitar">−</button>
          <input type="text" class="cq-input" id="detail-qty-input" inputmode="numeric" autocomplete="off" aria-label="Cantidad" value="1" />
          <button type="button" class="cq-btn" data-a="plus" aria-label="Sumar">+</button>
          <button type="button" class="cq-del" id="detail-qty-del" aria-label="Eliminar"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
        </div>
      </div>
      <div id="similar-section" class="featured-section hidden">
        <div class="section-title">Productos similares</div>
        <div id="similar-viewport" class="featured-viewport">
          <div id="similar-track" class="featured-track"></div>
        </div>
        <div id="similar-dots" class="featured-dots"></div>
      </div>
    </div>
    </div>
  </main>

  <main id="view-cart" class="view view-cart hidden">
    <button id="cart-hero-back" class="biz-back-btn hidden" aria-label="Volver">&lt;</button>
    <div class="brand-hero always-mini">
      <div class="hero-row">
        <div class="logo-square"><img src="fotos%20ejemplo/logo.png" alt="MegaMerca" /></div>
        <div class="nav-cluster">
          <button class="nav-btn" data-view="home" aria-label="Inicio">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg>
            <span class="nav-label">Inicio</span>
          </button>
          <button class="nav-btn active" data-view="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
            <span class="nav-label">Carrito</span>
            <span class="cart-badge hidden">0</span>
          </button>
          <button class="nav-btn" data-view="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="nav-label">Perfil</span>
          </button>
        </div>
      </div>
      <div class="hero-mini">
        <div class="logo-square mini"><img src="fotos%20ejemplo/logo.png" alt="MegaMerca" /></div>
        <div class="nav-mini">
          <div class="search-box mini">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
            <input class="search-input" type="text" placeholder="Buscar producto..." autocomplete="off" />
          </div>
          <button class="nav-btn mini" data-view="home" aria-label="Inicio">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg>
          </button>
          <button class="nav-btn mini active" data-view="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
            <span class="cart-badge hidden">0</span>
          </button>
          <button class="nav-btn mini" data-view="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="page">
      <div id="cart-items" class="cart-items"></div>
      <div id="cart-summary" class="cart-summary hidden">
        <div class="cart-summary-row"><span>Subtotal</span><span id="cart-subtotal">0 CUP</span></div>
        <div class="cart-summary-row"><span>Mensajería</span><span id="cart-shipping">250 CUP</span></div>
        <div class="cart-summary-row total"><span>Total</span><span id="cart-total">250 CUP</span></div>
      </div>
    </div>
  </main>

  <main id="view-profile" class="view view-profile hidden">
    <button id="profile-hero-back" class="biz-back-btn hidden" aria-label="Volver">&lt;</button>
    <div class="brand-hero always-mini">
      <div class="hero-row">
        <div class="logo-square"><img src="fotos%20ejemplo/logo.png" alt="MegaMerca" /></div>
        <div class="nav-cluster">
          <button class="nav-btn" data-view="home" aria-label="Inicio">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg>
            <span class="nav-label">Inicio</span>
          </button>
          <button class="nav-btn" data-view="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
            <span class="nav-label">Carrito</span>
            <span class="cart-badge hidden">0</span>
          </button>
          <button class="nav-btn active" data-view="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="nav-label">Perfil</span>
          </button>
        </div>
      </div>
      <div class="hero-mini">
        <div class="logo-square mini"><img src="fotos%20ejemplo/logo.png" alt="MegaMerca" /></div>
        <div class="nav-mini">
          <div class="search-box mini">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
            <input class="search-input" type="text" placeholder="Buscar producto..." autocomplete="off" />
          </div>
          <button class="nav-btn mini" data-view="home" aria-label="Inicio">
            <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"/></svg>
          </button>
          <button class="nav-btn mini" data-view="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
            <span class="cart-badge hidden">0</span>
          </button>
          <button class="nav-btn mini active" data-view="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="page">
      <div class="profile-tabs">
        <button class="profile-tab active" data-tab="info">Perfil</button>
        <button class="profile-tab" data-tab="history">Historial</button>
        <div id="profile-tab-indicator" class="profile-tab-indicator"></div>
      </div>
    <div id="tab-info" class="tab-content">
      <form id="profile-form" class="profile-form">
        <div class="field">
          <label for="profileName">Nombre</label>
          <div class="field-input">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="profileName" name="profileName" required autocomplete="name" placeholder="Tu nombre" />
          </div>
        </div>
        <div class="field">
          <label for="profileContact">Teléfono / contacto</label>
          <div class="field-input">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 1.9z"/></svg>
            <input type="text" id="profileContact" name="profileContact" required autocomplete="tel" placeholder="Tu teléfono" />
          </div>
        </div>
        <div class="field">
          <label for="profilePlace">Dirección de entrega</label>
          <div class="field-input">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <input type="text" id="profilePlace" name="profilePlace" required placeholder="Tu dirección" />
          </div>
        </div>
        <button type="submit" class="save-btn">Guardar</button>
        <p class="form-note"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2 1 21h22L12 2zm1 14h-2v2h2v-2zm0-7h-2v5h2V9z"/></svg><span>Esta información se utiliza solamente para el autorrellenado del pedido y ver tu historial.</span></p>
        <p id="profile-status" class="status-msg"></p>
      </form>
    </div>
    <div id="tab-history" class="tab-content hidden">
      <div id="history-list" class="history-list"></div>
    </div>
    </div>
  </main>

  <div id="overlay" class="overlay"></div>

  <div id="checkout-modal" class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Datos del pedido</h2>
      <button id="checkout-close" class="icon-btn">✕</button>
    </div>
    <form id="checkout-form" class="sheet-body">
      <label>Nombre del cliente
        <input type="text" name="clientName" required autocomplete="name" />
      </label>
      <label>Teléfono / contacto
        <input type="text" name="contact" required autocomplete="tel" />
      </label>
      <label>Lugar / dirección
        <input type="text" name="place" required />
      </label>
      <label>Hora de entrega
        <select name="time" id="checkout-time">
          <option value="">Entregar lo antes posible</option>
        </select>
        <small class="time-hint">Disponible de 9:00 a 21:00</small>
      </label>
      <button type="submit" class="primary-btn">Confirmar pedido</button>
      <p id="checkout-status" class="status-msg"></p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
